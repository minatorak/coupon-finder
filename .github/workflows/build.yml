name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.13"

jobs:
  quality:
    name: Quality and version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check version against tag
        run: bun run check:version -- "$GITHUB_REF_NAME"

      - name: Check release public key consistency
        run: bun run check:release-key

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun test --pass-with-no-tests

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build release archive
        run: bun run build:release -- --target "${{ matrix.target }}" --output-dir dist/release

      - name: Extract and smoke-test packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          extracted="$(mktemp -d)"
          clean_home="$(mktemp -d)"
          tar -xzf "dist/release/coupon-finder-${{ matrix.target }}.tar.gz" -C "${extracted}"
          env -i HOME="${clean_home}" PATH="/usr/bin:/bin" \
            COUPON_FINDER_INSTALL_ROOT="${clean_home}/.local/share/coupon-finder" \
            NODE_PATH="${extracted}/coupon-finder/lib/node_modules" \
            PLAYWRIGHT_BROWSERS_PATH="${clean_home}/.local/share/coupon-finder/browsers" \
            "${extracted}/coupon-finder/bin/coupon-finder-runtime" --release-smoke
          "${extracted}/coupon-finder/bin/coupon-finder-runtime" --version
          if grep -a -R -E "${GITHUB_WORKSPACE}/node_modules|/Users/runner/work/[^/]+/[^/]+/node_modules" "${extracted}/coupon-finder"; then
            echo "release contains an absolute checkout dependency path" >&2
            exit 1
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/release/coupon-finder-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble exact release asset set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-x64; do
            source="artifacts/release-${target}/coupon-finder-${target}.tar.gz"
            test -f "${source}"
            cp "${source}" "release/coupon-finder-${target}.tar.gz"
          done

      - name: Create stable checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release
            sha256sum \
              coupon-finder-darwin-arm64.tar.gz \
              coupon-finder-darwin-x64.tar.gz \
              coupon-finder-linux-x64.tar.gz \
              | LC_ALL=C sort -k2,2
          ) > release/checksums.txt

      - name: Sign checksum manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RELEASE_SIGNING_PRIVATE_KEY:-}" \
            || { echo "RELEASE_SIGNING_PRIVATE_KEY is not configured" >&2; exit 1; }
          private_key="${RUNNER_TEMP}/coupon-finder-release-private.pem"
          printf '%s\n' "${RELEASE_SIGNING_PRIVATE_KEY}" > "${private_key}"
          chmod 0600 "${private_key}"
          openssl dgst -sha256 -sign "${private_key}" \
            -out release/checksums.txt.sig release/checksums.txt
          rm -f "${private_key}"

      - name: Re-verify signature and all hashes
        shell: bash
        run: |
          set -euo pipefail
          openssl dgst -sha256 -verify keys/release-public.pem \
            -signature release/checksums.txt.sig release/checksums.txt
          (cd release && sha256sum -c checksums.txt)

      - name: Validate release asset contract
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            coupon-finder-darwin-arm64.tar.gz
            coupon-finder-darwin-x64.tar.gz
            coupon-finder-linux-x64.tar.gz
            checksums.txt
            checksums.txt.sig
          )
          for asset in "${expected[@]}"; do
            test -f "release/${asset}"
          done
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq "${#expected[@]}"

      - name: Installer and uninstaller end-to-end
        shell: bash
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          COUPON_FINDER_DOWNLOAD_BASE_URL="file://${PWD}/release" \
          COUPON_FINDER_EXPECTED_VERSION="${GITHUB_REF_NAME#v}" \
          HOME="${test_home}" SHELL=/bin/bash bash install.sh
          HOME="${test_home}" "${test_home}/.local/bin/coupon-finder" --version
          HOME="${test_home}" "${test_home}/.local/bin/coupon-finder" --release-smoke
          HOME="${test_home}" bash uninstall.sh --yes
          test ! -e "${test_home}/.local/bin/coupon-finder"
          test ! -e "${test_home}/.local/share/coupon-finder"

      - name: Fail if the GitHub Release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
